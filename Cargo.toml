[package]
edition = "2024"
authors = ["jinti<shenjindi@fourz.cn>"]
name = "opus-rs"
version = "0.1.42"
description = "pure Rust implementation of Opus codec"
license = "BSD-3-Clause"
repository = "https://github.com/restsend/opus-rs"
exclude = [
    "opus-1.6.1/",
    "libopus/",
    "fuzz/",
    "fixtures/",
]

[features]
default = ["std", "heap"]
# `std` links the standard library for float math; without it the crate is
# `#![no_std]` and needs the `libm` feature.
std = ["fearless_simd/std"]
# With `heap` (default), the large codec state (`OpusEncoder`/`OpusDecoder`
# working buffers) lives on the heap behind `Box`, so the public structs are tiny
# (~1 KB) and constructing them uses almost no stack. This requires `std`.
#
# Without `heap` (i.e. `default-features = false`), the crate is `#![no_std]`
# with **no `alloc`** (fully heap-free — no global allocator required): every
# working buffer is an inline fixed-size array, so `OpusEncoder`/`OpusDecoder`
# are large (~250 KB / ~175 KB) and must be placed in a `static` or on a large
# stack by the caller.
heap = ["std"]
# Required for `#![no_std]` builds: provides `sin`/`cos`/`sqrt`/`exp2`/... via a
# pure-Rust port of musl libm (`core` does not provide transcendentals). Not
# needed when `std` is enabled. Enable with:
#   opus-rs = { version = "...", default-features = false, features = ["libm"] }
libm = ["dep:libm", "fearless_simd/libm"]
# No effect: the mode table is a compile-time `static`, so the crate needs no
# atomics. Kept so that existing dependents still build.
portable-atomic = []
# Exposes internals to the differential fuzz harnesses in `fuzz/`.
fuzzing = ["std"]

# Neural network features of libopus (its `dnn/` folder), all off by
# default as in libopus. They mirror libopus's configure options:
#
# `dnn`: the code every neural feature needs (the layer kernels, the weight
# blob parser, the built-in models, PitchDNN, FARGAN, the PLC model and the
# LPCNet feature analysis); libopus compiles these sources whenever one of
# the options below is on. Alone it changes no codec behaviour.
dnn = []
# `deep-plc`: `--enable-deep-plc` (ENABLE_DEEP_PLC), deep packet loss
# concealment at decoder complexity 5 and above.
deep-plc = ["dnn"]
# `dred`: `--enable-dred` (ENABLE_DRED), deep redundancy: the RDOVAE encoder
# and decoder and the DRED packet extension. It turns on `deep-plc`, as
# libopus's configure defines ENABLE_DEEP_PLC with `--enable-dred`: the
# decoder conceals a loss from the DRED features through the deep PLC state.
dred = ["deep-plc"]
# `osce`: `--enable-osce` (ENABLE_OSCE and ENABLE_OSCE_BWE), the LACE and
# NoLACE SILK enhancers and the BBWENet bandwidth extension. It turns on
# `deep-plc`, as libopus's configure defines ENABLE_DEEP_PLC with
# `--enable-osce` too.
osce = ["deep-plc"]

[dependencies]
libm = { version = "0.2", optional = true, default-features = false }

# Runtime-dispatched SIMD through safe kernels (SILK's delayed-decision
# quantizer); the crate itself stays `#![forbid(unsafe_code)]`.
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
fearless_simd = { version = "1.2", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1"
opus = { version = "0.3", default-features = false }
opusic-sys = "0.7"
[[bench]]
name = "opus_bench"
harness = false
